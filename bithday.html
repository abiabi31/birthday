<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Birthday Surprise</title>

    <style>
      /* html,
      body {
        margin: 0;
        overflow: hidden;
        height: 100%;
        background: radial-gradient(circle at top, #1b2735, #090a0f 70%);
        font-family: Arial, sans-serif;
      } */

      canvas {
        pointer-events: none;
      }
      h1 {
        position: absolute;
        top: 30px;
        width: 100%;
        text-align: center;
        color: white;
        font-size: 3rem;
        text-shadow: 0 0 20px #fff;
        z-index: 10;
        opacity: 0;
        transform: scale(0.5);
        transition: 1s;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden; /* 👉 scroll stop */
        height: 100%;
      }

      #bgVideo {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        object-fit: cover;
        z-index: -1;
      }
      /* BUTTON */
      #surpriseBtn {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        padding: 18px 28px;
        font-size: 22px;
        border: none;
        border-radius: 15px;
        cursor: pointer;
        background: linear-gradient(45deg, #ff4d6d, #ffcc00);
        color: white;
        z-index: 10;
      }

      /* #stopBtn, */
      #nextBtn {
        position: absolute;
        bottom: 30px;
        padding: 12px 20px;
        border: none;
        border-radius: 10px;
        color: white;
        display: none;
      }

      /* #stopBtn {
        left: 40%;
        background: #ff9800;
      } */

      #nextBtn {
        left: 60%;
        background: #4caf50;
      }
    </style>
  </head>

  <body>
    <h1 id="title">🎉 Happy Birthday 🎉</h1>
    <video autoplay muted loop id="bgVideo">
      <source src="./song/a.mp4" type="video/mp4" />
    </video>

    <button id="surpriseBtn" onclick="startShow()">Surprise 🎁</button>
    <!-- <button id="stopBtn" onclick="stopShow()">Stop ⛔</button> -->
    <!-- <video id="bgVideo" autoplay muted loop>
      <source src="./song/bir.mp4" type="video/mp4" />
    </video> -->

    <button
      id="nextBtn"
      onclick="window.location.href = '/home/abi/Public/stdy/birth/vido.html'"
      style="display: none"
    >
      Next 👉
    </button>
    <audio id="music">
      <source src="./song/a.mp3" type="audio/mp3" />
    </audio>

    <canvas id="canvas"></canvas>

    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");
      const music = document.getElementById("music");

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener("resize", resize);

      // 🌍 MULTI LANGUAGE NAME
      const names = [
        "Reshma",
        "ரேஷ்மா",
        "रेश्मा",
        "റേഷ്മ",
        "ರೇಷ್ಮಾ",
        "రేష్మా",
        "বেশমা",
        "رېشما",
        "ريشما",
        "Ռեշմա",
        "Решма",
        "Рэшма",
        "Ｒｅｓｈｍａ",
        "れしゅま",
        "レスマ",
        "𝓡𝓮𝓼𝓱𝓶𝓪",
        "ℜ𝔢𝔰𝔥𝔪𝔞",
        "𝑅𝑒𝑠ℎ𝑚𝑎",
        "Reshμα",
        "Resḥma",
      ];

      let rockets = [];
      let particles = [];
      let texts = [];
      let started = false;
      let rocketInterval;
      let textInterval;
      let shake = 0;

      // 🎇 ROCKET
      class Rocket {
        constructor() {
          this.x = Math.random() * canvas.width;
          this.y = canvas.height + 20;
          this.targetY = Math.random() * canvas.height * 0.4 + 100;
          this.speed = Math.random() * 2 + 2;
          this.color = `hsl(${Math.random() * 360},100%,60%)`;
        }

        update() {
          this.y -= this.speed;
          if (this.y <= this.targetY) {
            explode(this.x, this.y, this.color);
            shake = 15;
            return false;
          }
          return true;
        }

        draw() {
          ctx.fillStyle = this.color;
          ctx.beginPath();
          ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // 💖 PARTICLE
      class Particle {
        constructor(x, y, color) {
          this.x = x;
          this.y = y;
          this.color = color;

          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 5;

          this.vx = Math.cos(angle) * speed;
          this.vy = Math.sin(angle) * speed;

          this.life = 120;
          this.size = Math.random() * 3 + 2;
        }

        update() {
          this.x += this.vx;
          this.y += this.vy;
          this.vy += 0.02;
          this.life -= 1.2;
        }

        draw() {
          ctx.save();
          ctx.globalAlpha = this.life / 120;
          ctx.fillStyle = this.color;

          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();

          ctx.restore();
        }
      }

      // 🌍 FLOATING TEXT
      class FloatingText {
        constructor() {
          this.text = names[Math.floor(Math.random() * names.length)];
          this.x = Math.random() * canvas.width;
          this.y = canvas.height + 50;
          this.speed = Math.random() * 1.5 + 0.5;
          this.size = Math.random() * 28 + 18;
          this.alpha = Math.random() * 0.5 + 0.3;
        }

        update() {
          this.y -= this.speed;
          return this.y > -50;
        }

        draw() {
          ctx.save();
          ctx.globalAlpha = this.alpha;
          ctx.fillStyle = "white";
          ctx.shadowColor = "#ff4da6";
          ctx.shadowBlur = 15;
          ctx.font = `${this.size}px Arial`;
          ctx.fillText(this.text, this.x, this.y);
          ctx.restore();
        }
      }

      function explode(x, y, color) {
        for (let i = 0; i < 120; i++) {
          particles.push(new Particle(x, y, color));
        }

        document.getElementById("title").style.opacity = "1";
        document.getElementById("title").style.transform = "scale(1.3)";
      }

      function animate() {
        requestAnimationFrame(animate);
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 🌋 SHAKE
        if (shake > 0) {
          const dx = (Math.random() - 0.5) * shake;
          const dy = (Math.random() - 0.5) * shake;
          ctx.save();
          ctx.translate(dx, dy);
          shake *= 0.9;
        } else {
          ctx.save();
        }

        rockets = rockets.filter((r) => {
          r.draw();
          return r.update();
        });

        particles = particles.filter((p) => {
          p.draw();
          p.update();
          return p.life > 0;
        });

        texts = texts.filter((t) => {
          t.draw();
          return t.update();
        });

        ctx.restore();
      }

      function startShow() {
        if (started) return;
        started = true;

        document.getElementById("surpriseBtn").style.display = "none";
        document.getElementById("nextBtn").style.display = "block";

        music.play().catch((err) => console.log(err));

        rocketInterval = setInterval(() => {
          rockets.push(new Rocket());
        }, 500);

        textInterval = setInterval(() => {
          texts.push(new FloatingText());
        }, 350);

        // 👉 10 seconds apram redirect
        setTimeout(() => {
          window.location.href = "/home/abi/Public/stdy/birth/vido.html";
        }, 20000);
      }

      animate();
    </script>
  </body>
</html>
